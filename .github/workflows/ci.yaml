# OSB0-F-06: lint, typecheck and tests (against the fake of the CAPI Navigator API).
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      # Node.js 26 ships without corepack: pnpm in the version of package.json.
      - run: npm install --global pnpm@12.16.1
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      # OSB0-F-02: the client types match the pinned OpenAPI document of CAPI Navigator.
      - name: generated client types are up to date
        run: pnpm api:types && git diff --exit-code src/capi/schema.generated.ts
      # NF-03: fails below 80 % line coverage.
      - run: pnpm test:coverage
      - run: pnpm build
      # OSB4-F-01: the Helm chart lints and renders (helm is preinstalled on the runner).
      - name: Helm chart
        run: |
          chart=deploy/helm/capi-navigator-osb
          helm lint "$chart" --set config.CAPIN_URL=https://c.example.com \
            --set config.CAPIN_CONNECTION=home --set secrets.existingSecret=s
          helm template t "$chart" --set config.CAPIN_URL=https://c.example.com \
            --set config.CAPIN_CONNECTION=home --set secrets.capinToken=x \
            --set secrets.brokerPassword=y --set ingress.enabled=true > /dev/null
      - name: Container image builds
        run: docker build -t capi-navigator-osb:ci .
