{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "osb.fullname" . }}
  labels: {{- include "osb.labels" . | nindent 4 }}
type: Opaque
stringData:
  capin-token: {{ required "secrets.capinToken or secrets.existingSecret is required" .Values.secrets.capinToken | quote }}
  broker-password: {{ required "secrets.brokerPassword or secrets.existingSecret is required" .Values.secrets.brokerPassword | quote }}
{{- end }}
